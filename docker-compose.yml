version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: nwis_postgis
    environment:
      POSTGRES_USER: oil_admin
      POSTGRES_PASSWORD: oil_secure_pass_2026
      POSTGRES_DB: nwis_wells_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oil_admin -d nwis_wells_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nwis_backend
    environment:
      - DATABASE_URL=postgresql://oil_admin:oil_secure_pass_2026@db:5432/nwis_wells_db
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
      - uploads_data:/app/uploads

volumes:
  postgis_data:
  chroma_data:
  uploads_data:
